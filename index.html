<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: deep-navy rail with the Z mark · patient list column · patient file with timeline. Palette taken from the hospital website. */
:root{
  --navy:#062b2d; --navy-2:#0b3b3d; --navy-3:#124a4c; --on-navy:#eaf4f2; --on-navy-mute:#9fc2bd;
  --brand:#0f6e6a; --brand-2:#17979a; --tint:#e6f2f0; --gold:#c98f4f; --gold-soft:#f7ecdf;
  --bg:#eef3f2; --surface:#ffffff; --line:#dde6e4; --line-2:#eaf0ef; --ink:#0f2124; --muted:#5a6d6f;
  --high:#c3312b; --high-soft:#fbe7e5; --low:#2563a6; --low-soft:#e4edf8; --ok:#1f9d63; --ok-soft:#e2f4ea;
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(6,43,45,.06),0 8px 24px rgba(6,43,45,.07);
}
[dir=rtl]{--f-display:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;--f-body:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

.app{display:grid;grid-template-columns:264px 380px minmax(0,1fr);height:100vh}

/* ---------- Rail ---------- */
.rail{background:linear-gradient(180deg,var(--navy) 0%,#04221f 100%);color:var(--on-navy);display:flex;flex-direction:column;padding:20px 14px 16px;gap:6px;overflow:auto;position:relative}
.rail::after{content:"";position:absolute;inset:0 auto 0 0;width:1px;background:linear-gradient(180deg,transparent,rgba(201,143,79,.5),transparent)}
[dir=rtl] .rail::after{inset:0 0 0 auto}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand .mark{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.brand .mark img{width:34px;height:34px}
.brand b{display:block;font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.brand small{color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
[dir=rtl] .brand small{letter-spacing:0;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:transparent;color:var(--on-navy-mute);cursor:pointer;text-align:start;font-weight:600}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:rgba(255,255,255,.06);color:var(--on-navy)}
.navbtn.on{background:rgba(23,151,154,.18);color:#fff}
.profile{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;margin:10px 0 4px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.profile .av{width:44px;height:44px;border-radius:12px;background:var(--brand-2);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.profile b{display:block;font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.profile small{display:block;color:var(--gold);font-size:12px;font-weight:600}
.profile button{border:0;background:transparent;color:var(--on-navy-mute);width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.profile button:hover{background:rgba(255,255,255,.1);color:#fff}
.profile button svg{width:16px;height:16px}
.profile>div{min-width:0}
.rail h4{margin:16px 8px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--on-navy-mute);font-weight:700;display:flex;justify-content:space-between;align-items:center}
[dir=rtl] .rail h4{letter-spacing:0;font-size:12px}
.rail h4 button{border:0;background:rgba(255,255,255,.08);color:var(--on-navy);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.rail h4 button:hover{background:var(--brand-2)}
.doc{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;border:0;background:transparent;color:var(--on-navy);cursor:pointer;text-align:start;width:100%}
.doc:hover{background:rgba(255,255,255,.06)}
.doc.on{background:var(--on-navy);color:var(--navy)}
.doc .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--navy-3);color:var(--on-navy)}
.doc.on .av{background:var(--brand);color:#fff}
.doc .nm{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .sp{display:block;font-size:11.5px;opacity:.7;font-weight:500}
.doc .ct{font-family:var(--f-num);font-size:11.5px;opacity:.75}
.grow{flex:1;min-height:12px}
.foot{display:grid;gap:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.06);border-radius:9px;padding:3px}
.langs button{border:0;background:transparent;color:var(--on-navy-mute);border-radius:7px;padding:6px 0;cursor:pointer;font-size:12.5px;font-weight:600}
.langs button.on{background:var(--on-navy);color:var(--navy)}
.rbtn{display:flex;gap:8px;align-items:center;border:0;background:transparent;color:var(--on-navy-mute);padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;text-align:start}
.rbtn:hover{background:rgba(255,255,255,.06);color:var(--on-navy)}
.rbtn svg{width:16px;height:16px}

/* ---------- List column ---------- */
.list{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.lhead{padding:18px 18px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.lhead h2{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.lhead h2 .num{font-size:13px;color:var(--muted);font-weight:500}
.searchbox{position:relative}
.searchbox svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.searchbox input{width:100%;padding:11px 14px;padding-inline-start:38px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:14px}
.searchbox input:focus{background:#fff;border-color:var(--brand-2);outline:none;box-shadow:0 0 0 4px rgba(23,151,154,.12)}
.searchbox kbd{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font:600 10.5px var(--f-num);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:#0c5f5b}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.wide{width:100%}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:#b57d40}
.btn.sec{background:var(--tint);color:var(--brand)}
.btn.sec:hover{background:#d6ebe8}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--brand-2);color:var(--brand)}
.btn.danger{background:#fff;color:var(--high);border:1px solid #f0c9c6}
.btn.danger:hover{background:var(--high-soft)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.plist{overflow:auto;flex:1;padding:6px 8px}
.pitem{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.pitem:hover{background:var(--bg)}
.pitem.on{background:var(--tint);border-color:#cfe6e2}
.pav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;font-family:var(--f-display)}
.pitem .nm{font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .mt{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .fn{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:end;line-height:1.5}
.pitem .new{display:inline-block;background:var(--gold-soft);color:#9a6427;font-size:10px;font-weight:700;padding:0 6px;border-radius:99px;font-family:var(--f-body)}
.pitem .min{min-width:0}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:#b7c8c5;margin-bottom:8px}

/* ---------- Main ---------- */
.main{overflow:auto;min-width:0}
.wrap{max-width:1040px;margin:0 auto;padding:28px 32px 48px}
.dash-hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 60%,var(--brand) 140%);color:var(--on-navy);border-radius:18px;padding:28px 30px;position:relative;overflow:hidden}
.dash-hero h1{font-size:26px;font-weight:800}
.dash-hero p{color:var(--on-navy-mute);margin:6px 0 0}
.dash-hero .date{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
[dir=rtl] .dash-hero .date{letter-spacing:0;font-size:13px}
.dash-hero .bigz{position:absolute;inset-inline-end:28px;top:50%;transform:translateY(-50%);width:120px;height:120px;opacity:.12}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 26px}
.kpi{background:var(--surface);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{font-family:var(--f-num);font-size:28px;font-weight:500;display:block;margin-top:4px;color:var(--navy)}
.kpi.accent b{color:var(--brand)}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.sec-title h2{font-size:16px;font-weight:700}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.recent .ri{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.recent .ri:last-child{border-bottom:0}
.recent .ri:hover{background:#fafcfc}
.recent .ri .d{font-family:var(--f-num);color:var(--muted);font-size:12.5px}
.recent .ri b{font-weight:700}
.recent .ri .dx{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--brand);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.phead{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.phead .top{display:flex;gap:18px;align-items:center;padding:22px 24px;flex-wrap:wrap;background:linear-gradient(120deg,#f7fbfa,#fff)}
.phead .bigav{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;font-family:var(--f-display);flex:none}
.phead h1{font-size:23px;font-weight:800}
.phead .sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center;color:var(--muted);font-size:13px}
.phead .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.facts>div{padding:13px 24px;border-inline-end:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.facts small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] .facts small{letter-spacing:0;font-size:12px}
.facts span{font-weight:600}
.alerts{display:flex;gap:10px;padding:14px 24px;flex-wrap:wrap;border-top:1px solid var(--line)}
.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 13px;border-radius:10px;font-size:13px;flex:1;min-width:220px}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px}
.alert.red{background:var(--high-soft);color:#8f201b}
.alert.gold{background:var(--gold-soft);color:#7d4f1d}
.alert b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] .alert b{letter-spacing:0;font-size:12px}

.timeline{position:relative;margin-top:8px;padding-inline-start:26px}
.timeline::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--brand-2),var(--line))}
.visit{position:relative;margin-bottom:16px}
.visit::before{content:"";position:absolute;inset-inline-start:-25px;top:18px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand-2)}
.visit:first-child::before{background:var(--brand-2);box-shadow:0 0 0 5px rgba(23,151,154,.15)}
.vhead{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.vhead .d{font-family:var(--f-num);font-weight:500;color:var(--navy)}
.vhead .dx{font-family:var(--f-display);font-weight:700;font-size:15.5px;flex:1;min-width:200px}
.vhead .acts{display:flex;gap:6px}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--brand);border-color:var(--brand-2)}
.iconbtn.del:hover{color:var(--high);border-color:#f0c9c6}
.iconbtn svg{width:15px;height:15px}
.vbody{padding:14px 18px 16px;display:grid;gap:14px}
.lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
[dir=rtl] .lbl{letter-spacing:0;font-size:12px}
.lbl svg{width:14px;height:14px;color:var(--brand-2)}
.meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.med{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fbfdfd}
.med b{display:block;font-weight:700}
.med span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:start;vertical-align:middle}
th{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] th{letter-spacing:0;font-size:12px}
tr:last-child td{border-bottom:0}
td.v{font-family:var(--f-num);font-weight:500}
td.v.H{color:var(--high)} td.v.L{color:var(--low)}
.rng{width:120px}
.bar{position:relative;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--low-soft) 0 20%,var(--ok-soft) 20% 80%,var(--high-soft) 80% 100%)}
.bar i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ok);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bar i.H{background:var(--high)} .bar i.L{background:var(--low)}
.rtxt{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.flag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:700}
.flag.H{background:var(--high-soft);color:var(--high)}
.flag.L{background:var(--low-soft);color:var(--low)}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.complaint{color:var(--ink)}

/* ---------- Dialogs ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(780px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(4,30,28,.35);color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(4,25,24,.55);backdrop-filter:blur(3px)}
dialog form{display:flex;flex-direction:column;max-height:92vh;margin:0}
.dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.dhead .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--brand);display:grid;place-items:center}
.dhead .ic svg{width:18px;height:18px}
.dhead h3{font-size:17px;font-weight:700}
.dbody{padding:18px 22px;overflow:auto;display:grid;gap:14px}
.dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;flex-direction:row-reverse;gap:8px;justify-content:flex-start;background:#fafcfc}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.rows input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.rows input:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px rgba(23,151,154,.12)}
label.f textarea{min-height:64px;resize:vertical}
label.f .req{color:var(--high)}
.rows{display:grid;gap:6px}
.rows .r{display:grid;gap:6px;align-items:center}
.rows.m .r{grid-template-columns:2fr 1fr 1.2fr 70px 30px}
.rows.l .r{grid-template-columns:2fr 1fr 90px 1fr 30px}
.x{border:0;background:transparent;color:#b5c3c1;cursor:pointer;font-size:20px;line-height:1}
.x:hover{color:var(--high)}
.subhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.hint{font-size:12px;color:var(--muted);font-weight:500}

.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
[dir=rtl] .toast{transform:translateX(50%) translateY(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[dir=rtl] .toast.show{transform:translateX(50%) translateY(0)}
.toast svg{width:18px;height:18px;color:#5fd3a0}
.warnbar{position:fixed;inset:auto 0 0 0;background:var(--high);color:#fff;padding:10px 16px;text-align:center;z-index:90;font-weight:600}
.sample-note{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--gold-soft);color:#7d4f1d;border-radius:12px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}

.trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:26px}
.trend{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.trend .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trend .th b{font-weight:700}
.trend .th .last{font-family:var(--f-num);font-size:18px;font-weight:500}
.trend .th .last.H{color:var(--high)} .trend .th .last.L{color:var(--low)}
.trend .th .last small{font-size:11px;color:var(--muted);margin-inline-start:3px}
.trend svg{display:block;width:100%;height:64px;margin-top:6px;overflow:visible}
.trend .tf{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:10.5px;color:var(--muted);margin-top:4px}
.delta{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--muted)}
.delta.up{background:var(--high-soft);color:var(--high)} .delta.down{background:var(--ok-soft);color:var(--ok)}
.rx-sheet{display:none}
.xclose{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;width:34px;height:34px;border-radius:8px;cursor:pointer}
.xclose:hover{background:var(--bg);color:var(--ink)}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--brand);font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px;margin:-6px 0 10px -8px}
.backbtn:hover{background:var(--tint)}
.backbtn svg{width:18px;height:18px}
[dir=rtl] .backbtn svg{transform:scaleX(-1)}
/* diagnosis picker */
.dxwrap{position:relative}
.dxpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;cursor:text}
.dxpick:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(23,151,154,.12)}
.dxpick input{flex:1;min-width:180px;border:0;outline:0;padding:5px 6px;font-size:14px;background:transparent;color:var(--ink)}
.dxchip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border-radius:8px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600}
[dir=rtl] .dxchip{padding:4px 10px 4px 6px}
.dxchip code{font:500 11px var(--f-num);background:rgba(255,255,255,.15);padding:1px 6px;border-radius:5px}
.dxchip.free{background:var(--gold)}
.dxchip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:16px;line-height:1;opacity:.7;padding:0 2px}
.dxchip button:hover{opacity:1}
.dxmenu{position:absolute;inset-inline:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(6,43,45,.18);max-height:330px;overflow:auto;z-index:20;padding:6px}
.dxmenu .grp{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 4px}
[dir=rtl] .dxmenu .grp{letter-spacing:0;font-size:12px}
.dxopt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.dxopt:hover,.dxopt.hl{background:var(--tint)}
.dxopt b{font-weight:700;font-size:14px}
.dxopt small{grid-column:1;color:var(--muted);font-size:12px}
.dxopt code{grid-row:1/3;grid-column:2;align-self:center;font:500 11.5px var(--f-num);color:var(--brand);background:var(--tint);padding:2px 7px;border-radius:6px}
.dxopt.hl code{background:#fff}
.dxopt .mine{color:#9a6427;font-weight:700;font-size:10.5px;margin-inline-start:6px}
.dxadd{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px dashed var(--line);margin-top:4px;color:var(--brand);font-weight:700;cursor:pointer;border-radius:8px}
.dxadd:hover,.dxadd.hl{background:var(--tint)}
.dxadd svg{width:16px;height:16px}
.dxinfo{display:grid;gap:8px}
.dxcard{border:1px solid #cfe6e2;background:linear-gradient(180deg,#f4faf9,#fff);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.dxcard .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dxcard .h b{font-weight:800}
.dxcard .h code{font:500 11.5px var(--f-num);background:var(--navy);color:#fff;padding:2px 7px;border-radius:6px}
.dxcard .h .cat{font-size:12px;color:var(--muted)}
.dxcard p{margin:0;font-size:13px;color:#2a3d3f}
.dxcard .tests{display:flex;flex-wrap:wrap;gap:5px}
.tchip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.dxcard .acts{display:flex;gap:6px;flex-wrap:wrap}
/* library */
.libhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.libhead h1{font-size:24px;font-weight:800;flex:1}
.libsearch{position:relative;flex:1;min-width:260px;max-width:420px}
.libsearch input{width:100%;padding:11px 14px;padding-inline-start:38px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:14px}
.libsearch svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cats button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.cats button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:8px;align-content:start}
.lcard .t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.lcard .t b{font-weight:800;font-size:15px}
.lcard .t code{font:500 11.5px var(--f-num);background:var(--tint);color:var(--brand);padding:2px 7px;border-radius:6px;white-space:nowrap}
.lcard .alt{font-size:12px;color:var(--muted)}
.lcard p{margin:0;font-size:13px;color:#2a3d3f}
.lcard .foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:8px}
.badge-mine{background:var(--gold-soft);color:#9a6427;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px}
.testpick{display:flex;flex-wrap:wrap;gap:6px;max-height:170px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fbfdfd}
.testpick label{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
.testpick input{margin:0}
.testpick label:has(input:checked){background:var(--tint);border-color:var(--brand-2);color:var(--brand)}
.vdx{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:200px}
.vdx .dxn{font-family:var(--f-display);font-weight:700;font-size:15.5px}
.vdx code{font:500 11px var(--f-num);background:var(--tint);color:var(--brand);padding:1px 6px;border-radius:5px}
.vdx .dxg{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.vdx .dxg+.dxg::before{content:"·";color:var(--muted);margin-inline-end:2px}
.print-only{display:none}
@media print{
  @page{margin:14mm}
  body.print-rx .app{display:none!important}
  body.print-rx .rx-sheet{display:block!important}
  .app{display:block;height:auto}
  .rail,.list,.noprint,.vhead .acts,.toast,.warnbar{display:none!important}
  .main{overflow:visible}.wrap{padding:0;max-width:none}
  .print-only{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:16px}
  .print-only img{width:40px}
  .card,.phead{box-shadow:none;border:1px solid var(--line)}
  .visit{break-inside:avoid}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1200px){.app{grid-template-columns:230px 320px minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:repeat(2,1fr)}}
.rx-sheet{font-family:var(--f-body);color:#111;max-width:180mm;margin:0 auto}
.rx-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:12px}
.rx-head .hl{display:flex;gap:12px;align-items:center}
.rx-head img{width:56px;height:56px}
.rx-head b{font-family:var(--f-display);font-size:20px;display:block;color:var(--navy)}
.rx-head small{color:#555}
.rx-pt{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px 18px;padding:14px 0;border-bottom:1px solid #ccc;font-size:13px}
.rx-pt span{color:#666;font-size:11px;display:block}
.rx-dx{padding:12px 0;font-size:14px}
.rx-big{font-family:Georgia,serif;font-size:42px;color:var(--brand);font-style:italic;line-height:1;margin:6px 0 4px}
.rx-list{list-style:none;padding:0;margin:0;counter-reset:rx}
.rx-list li{counter-increment:rx;padding:10px 0;border-bottom:1px dashed #bbb;display:grid;grid-template-columns:28px 1fr;gap:8px}
.rx-list li::before{content:counter(rx) ".";font-weight:700;color:var(--brand)}
.rx-list b{font-size:15px}
.rx-list span{display:block;color:#444;font-size:13px}
.rx-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:60px;font-size:12px;color:#555}
.rx-sign .line{border-top:1px solid #333;width:220px;padding-top:6px;text-align:center}
.rx-foot{margin-top:30px;border-top:2px solid var(--brand);padding-top:8px;font-size:11px;color:#666;text-align:center}

/* ---------- v1.1: secretary link, waiting list, updates ---------- */
.navbtn .bdg{margin-inline-start:auto;background:var(--gold);color:#fff;font:700 11px var(--f-num);padding:1px 8px;border-radius:99px}
.ver{color:var(--on-navy-mute);opacity:.6;font:500 10.5px var(--f-num);text-align:center;padding-top:2px}
body.sec #navDx,body.sec #exportBtn,body.sec #importBtn,body.sec #openBackups,body.sec #lanBtn{display:none!important}
.profile .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e06a5f;margin-inline-end:6px;vertical-align:1px}
.profile .dot.on{background:#3ad08a;box-shadow:0 0 0 3px rgba(58,208,138,.18)}
.profile small.cs{color:var(--on-navy-mute);font-weight:600}

.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolebtn{display:grid;gap:10px;justify-items:start;text-align:start;padding:20px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rolebtn:hover{border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(23,151,154,.1)}
.rolebtn .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--brand);display:grid;place-items:center}
.rolebtn .ic svg{width:22px;height:22px}
.rolebtn b{font-family:var(--f-display);font-size:16px}
.rolebtn small{color:var(--muted);font-size:12.5px;font-weight:500}

.doclist{display:grid;gap:6px;max-height:220px;overflow:auto}
.docopt{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 11px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:#fff;text-align:start;width:100%}
.docopt:hover{border-color:var(--brand-2)}
.docopt.on{border-color:var(--brand);background:var(--tint)}
.docopt .av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.docopt b{display:block;font-size:14px}
.docopt small{color:var(--muted);font-size:12px}
.docopt code{font:500 11px var(--f-num);color:var(--muted)}
.scanning{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;padding:10px 2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand-2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errline{color:var(--high);font-weight:600;font-size:13px;min-height:1px}
.linkbtn{border:0;background:transparent;color:var(--brand);font-weight:700;cursor:pointer;padding:4px 0;font-size:12.5px;justify-self:start}
.codebox{display:flex;justify-content:center;gap:8px;direction:ltr;margin:4px 0}
.codebox span{width:46px;height:58px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 28px var(--f-num)}
.ipline{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.ipline code{font:600 13px var(--f-num);color:var(--ink);background:var(--bg);padding:2px 8px;border-radius:6px}
.seclist{display:grid;gap:6px}
.secrow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--bg)}
.secrow b{flex:1}
.secrow small{color:var(--muted);font-size:12px}

.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.waiting{background:var(--gold-soft);color:#9a6427}
.st.in{background:var(--tint);color:var(--brand)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.cancelled{background:var(--bg);color:var(--muted)}

.qsec{margin-top:18px}
.qlist{display:grid;gap:10px}
.qcard{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;border-inline-start:4px solid var(--gold)}
.qcard.in{border-inline-start-color:var(--brand-2)}
.qcard.done,.qcard.cancelled{border-inline-start-color:var(--line);opacity:.72}
.qcard .qn{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:#9a6427;display:grid;place-items:center;font:600 15px var(--f-num)}
.qcard.in .qn{background:var(--tint);color:var(--brand)}
.qcard .qt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qcard .qt b{font-size:15px;font-family:var(--f-display)}
.qcard .qd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qcard .qc{color:var(--muted);font-size:13px;margin-top:4px}
.qcard .qs{display:flex;gap:8px;align-items:center}
.qcard .tm{font:500 12px var(--f-num);color:var(--muted)}
.dxp{display:inline-flex;gap:5px;align-items:center;background:var(--navy);color:#fff;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:600}
.dxp.new{background:var(--gold)}
.dxp code{font:500 10.5px var(--f-num);opacity:.75}
.vit{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border-radius:7px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--ink)}
.vit small{color:var(--muted);font-weight:600}

.secbanner{margin-top:18px;background:linear-gradient(120deg,#fff8ef,#fff);border:1px solid #ecd6bb;border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.secbanner .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.secbanner .h h2{font-size:15px;font-weight:700;color:#7d4f1d}
.secbanner .h .acts{margin-inline-start:auto;display:flex;gap:8px}
.secbanner .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.sendcard{margin-top:18px;padding:18px 20px;display:grid;gap:14px;border-top:4px solid var(--gold)}
.sendcard .sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sendcard .sh h2{font-size:17px;font-weight:800}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.prevdx{display:flex;gap:8px;flex-wrap:wrap}
.prevdx label{display:inline-flex;gap:7px;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;background:#fff}
.prevdx label:has(input:checked){border-color:var(--navy);background:var(--navy);color:#fff}
.prevdx input{accent-color:var(--gold)}
.inq{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);color:#7d4f1d;border-radius:11px;padding:10px 14px;font-weight:600;font-size:13px}
.inq .btn{margin-inline-start:auto}
.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:11px 14px;border-radius:11px;background:var(--surface);box-shadow:var(--shadow)}
.hrow .d{font:500 12.5px var(--f-num);color:var(--muted);padding-top:2px}
.hrow .c{color:var(--muted);font-size:12.5px;margin-top:4px}
.offbar{display:flex;gap:10px;align-items:center;background:var(--high-soft);color:#8f201b;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.offbar .btn{margin-inline-start:auto}
.loadingbox{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);padding:60px}

.updatebar{position:fixed;bottom:18px;inset-inline-end:18px;z-index:95;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,.3);font-weight:600}
.updatebar .btn.line{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}

[hidden]{display:none!important}
</style>

function migrate(d){
  if(!Array.isArray(d.visits))d.visits=[];
  if(!Array.isArray(d.customDx))d.customDx=[];
  if(!Array.isArray(d.queue))d.queue=[];else{const lim=Date.now()-60*864e5;d.queue=d.queue.filter(q=>(q.ts||0)>lim)}
  if(!d.dxTemplates||typeof d.dxTemplates!=="object")d.dxTemplates={};
  if(!d.profile){const f=(d.doctors||[])[0];d.profile=f?{name:f.name,specialty:f.specialty||""}:null}
  delete d.doctors;return d}
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.patients))return migrate(d)}}catch(e){}return migrate(window.desktop?{profile:null,patients:[],visits:[]}:sampleData())}

function flag(value,range){const v=parseFloat(String(value).replace(",","."));const r=parseRange(range);if(isNaN(v)||!r)return"";return v<r[0]?"L":v>r[1]?"H":""}
function barPos(value,range){const v=parseFloat(String(value).replace(",","."));const r=parseRange(range);if(isNaN(v)||!r||r[1]<=r[0])return null;const p=20+(v-r[0])/(r[1]-r[0])*60;return Math.max(3,Math.min(97,p))}

const latinDigits=s=>String(s||"").replace(/[٠-٩]/g,d=>"0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)]).replace(/[۰-۹]/g,d=>"0123456789"["۰۱۲۳۴۵۶۷۸۹".indexOf(d)]);
const normPhone=s=>{let d=latinDigits(s).replace(/\D/g,"");if(d.startsWith("00964"))d="0"+d.slice(5);else if(d.startsWith("964"))d="0"+d.slice(3);return d};
const normText=s=>latinDigits(s).toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ك/g,"ک").replace(/ي/g,"ی").replace(/\s+/g," ").trim();
function matches(p,q){
  if(!q)return true;
  const lq=latinDigits(q);
  const letters=lq.replace(/[\d\s+\-().]/g,"");
  const digits=normPhone(lq);
  const phone=normPhone(p.phone),fileD=latinDigits(p.fileNo||"").replace(/\D/g,"");
  const phoneHit=d=>!d||phone.includes(d.startsWith("0")?d:d.replace(/^0*/,""))||phone.includes(d)||fileD.includes(d);
  if(!letters)return digits.length>0&&phoneHit(digits);
  const words=normText(lq.replace(/[\d+\-().]/g," ")).split(" ").filter(Boolean);
  const hay=normText([p.name,p.fileNo].join(" "));
  return words.every(w=>hay.includes(w))&&phoneHit(digits);
}

  return db.patients.filter(p=>matches(p,q)).sort((a,b)=>activity(b)-activity(a));
}

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("search").placeholder=t("search");
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  document.title=t("hname")+" — "+t("system");
  try{localStorage.setItem(LKEY,lang)}catch(e){}
  render();
}

function trendsHTML(vs){
  const series={};
  for(const v of [...vs].reverse())for(const l of v.labs){const val=parseFloat(String(l.value).replace(",","."));if(isNaN(val))continue;
    const k=l.test.trim().toLowerCase();(series[k]=series[k]||{name:l.test,unit:l.unit,range:l.range,pts:[]}).pts.push({d:v.date,v:val});if(l.range)series[k].range=l.range;if(l.unit)series[k].unit=l.unit}
  const list=Object.values(series).filter(s=>s.pts.length>=2);
  if(!list.length)return"";
  const W=240,H=64,P=6;
  const cards=list.map(s=>{
    const r=parseRange(s.range),vals=s.pts.map(p=>p.v);
    let lo=Math.min(...vals,r?r[0]:Infinity),hi=Math.max(...vals,r?r[1]:-Infinity);if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
    const X=i=>P+i*(W-2*P)/(s.pts.length-1),Y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
    const band=r?`<rect x="0" y="${Y(r[1])}" width="${W}" height="${Math.max(1,Y(r[0])-Y(r[1]))}" fill="var(--ok-soft)"/>`:"";
    const line=s.pts.map((p,i)=>`${X(i)},${Y(p.v)}`).join(" ");
    const dots=s.pts.map((p,i)=>{const f=r?(p.v<r[0]?"L":p.v>r[1]?"H":""):"";return`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i===s.pts.length-1?4.5:3}" fill="${f==="H"?"var(--high)":f==="L"?"var(--low)":"var(--brand-2)"}" stroke="#fff" stroke-width="1.5"><title>${p.d}: ${p.v}</title></circle>`}).join("");
    const last=s.pts.at(-1),prev=s.pts.at(-2),lf=r?(last.v<r[0]?"L":last.v>r[1]?"H":""):"";
    const diff=last.v-prev.v,pct=prev.v?Math.round(diff/Math.abs(prev.v)*100):0;
    const mid=r?(r[0]+r[1])/2:null,better=mid!==null&&Math.abs(last.v-mid)<Math.abs(prev.v-mid);
    const cls=diff===0?"":better?"down":"up";
    return`<div class="trend"><div class="th"><b dir="auto">${esc(s.name)}</b><span class="last ${lf}" dir="ltr">${last.v}<small>${esc(s.unit)}</small></span></div>
      <div class="th" style="margin-top:2px"><span class="rtxt" dir="ltr">${esc(s.range||"")}</span><span class="delta ${cls}" dir="ltr">${diff>0?"▲":diff<0?"▼":"="} ${Math.abs(pct)}%</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="direction:ltr">${band}<polyline points="${line}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}</svg>
      <div class="tf" dir="ltr"><span>${s.pts[0].d}</span><span>${s.pts.length} ${t("ofResults")}</span><span>${last.d}</span></div></div>`}).join("");
  return`<div class="sec-title" style="margin-top:26px;margin-bottom:0"><h2>${t("trends")}</h2></div><div class="trends" style="margin-top:12px">${cards}</div>`;
}

/* ---------- diagnosis helpers ---------- */
const allDx=()=>[...DXLIB,...(db.customDx||[])];
const dxById=id=>allDx().find(d=>d.id===id);
const dxNameOf=(d,L)=>{L=L||lang;return(d.name&&(d.name[L]||d.name.en||d.name.ku||d.name.ar))||""};
function dxLabel(x,L){if(x.id){const d=dxById(x.id);if(d)return dxNameOf(d,L)}return x.label||x.code||""}
function visitDxList(v){return Array.isArray(v.dx)&&v.dx.length?v.dx:(v.diagnosis?[{label:v.diagnosis}]:[])}
function visitDxText(v){return visitDxList(v).map(x=>dxLabel(x)).join(" · ")}
function visitDxHTML(v){const l=visitDxList(v);return`<span class="vdx">${l.map((x,i)=>{const d=x.id&&dxById(x.id);return`<span class="dxg"><span class="dxn">${esc(dxLabel(x))}</span>${d&&d.code?`<code dir="ltr">${esc(d.code)}</code>`:""}</span>`}).join("")}</span>`}
function dxUsage(){const u={};for(const v of db.visits)for(const x of visitDxList(v))if(x.id)u[x.id]=(u[x.id]||0)+1;return u}
function dxCatName(c){if(c==="mine")return t("catMine");return DXCATS[c]?(DXCATS[c][lang]||DXCATS[c].en):c}
function searchDx(q){
  const usage=dxUsage(),list=allDx();
  if(!q){const top=list.filter(d=>usage[d.id]).sort((a,b)=>usage[b.id]-usage[a.id]).slice(0,8);return{top,rest:list.filter(d=>!usage[d.id]||!top.includes(d)).slice(0,40)}}
  const nq=normText(q),cq=q.trim().toUpperCase();
  const scored=[];
  for(const d of list){
    let sc=0;const code=(d.code||"").toUpperCase();
    if(code&&code.startsWith(cq))sc=100;
    const names=[d.name.ku,d.name.ar,d.name.en].filter(Boolean).map(normText);
    for(const n of names){if(n.startsWith(nq))sc=Math.max(sc,80);else if(n.split(/[\s()/-]+/).some(w=>w.startsWith(nq)))sc=Math.max(sc,60);else if(n.includes(nq))sc=Math.max(sc,40);
      else if(nq.split(" ").length>1&&nq.split(" ").every(w=>n.includes(w)))sc=Math.max(sc,30)}
    if(!sc&&normText(d.note||"").includes(nq)&&nq.length>3)sc=10;
    if(sc)scored.push([sc+(usage[d.id]||0)*2+(d.builtin?0:5),d]);
  }
  return{top:[],rest:scored.sort((a,b)=>b[0]-a[0]).slice(0,40).map(x=>x[1])};
}
let curDx=[],dxHL=-1,dxOpts=[];
function renderDxChips(){
  $("dxChips").innerHTML=curDx.map((x,i)=>{const d=x.id&&dxById(x.id);return`<span class="dxchip ${d?"":"free"}">${esc(dxLabel(x))}${d&&d.code?`<code dir="ltr">${esc(d.code)}</code>`:""}<button type="button" data-rmdx="${i}" aria-label="${t("del")}">×</button></span>`}).join("");
  renderDxInfo();
}
function renderDxInfo(){
  const tpl=db.dxTemplates||{};
  $("dxInfo").innerHTML=curDx.map((x,i)=>{const d=x.id&&dxById(x.id);if(!d)return"";
    const other=lang==="en"?(d.name.ku||d.name.ar):d.name.en;
    const tests=d.tests.map(k=>LABS[k]?LABS[k][0]:k);
    const meds=tpl[d.id]||[];
    return`<div class="dxcard"><div class="h"><b>${esc(dxNameOf(d))}</b>${d.code?`<code dir="ltr">${esc(d.code)}</code>`:""}<span class="cat">${esc(dxCatName(d.cat))}${other?" · "+esc(other):""}</span></div>
      ${d.note?`<p dir="auto">${esc(d.note)}</p>`:""}
      ${tests.length?`<div class="tests">${tests.map(n=>`<span class="tchip" dir="ltr">${esc(n)}</span>`).join("")}</div>`:""}
      <div class="acts">${tests.length?`<button type="button" class="btn sec sm" data-addtests="${i}">${I.lab}${t("addTests")}</button>`:""}
        ${meds.length?`<button type="button" class="btn sec sm" data-applymeds="${i}">${I.pill}${t("applyMeds")} (${meds.length})</button>`:""}
        <button type="button" class="btn line sm" data-savetpl="${i}">${t("saveTemplate")}</button></div></div>`}).join("");
}
function showDxMenu(){
  const q=$("v_dxq").value.trim();const r=searchDx(q);const chosen=new Set(curDx.map(x=>x.id).filter(Boolean));
  const top=r.top.filter(d=>!chosen.has(d.id)),rest=r.rest.filter(d=>!chosen.has(d.id)&&!top.includes(d));
  dxOpts=[...top,...rest];dxHL=dxOpts.length&&q?0:-1;
  const opt=(d,i)=>{const other=lang==="en"?(d.name.ku||d.name.ar):d.name.en;return`<div class="dxopt ${i===dxHL?"hl":""}" data-dxi="${i}"><b>${esc(dxNameOf(d))}${d.builtin?"":`<span class="mine">${t("mine")}</span>`}</b>${d.code?`<code dir="ltr">${esc(d.code)}</code>`:"<span></span>"}<small>${esc(other||"")}${other?" · ":""}${esc(dxCatName(d.cat))}</small></div>`};
  let h="";
  if(top.length)h+=`<div class="grp">${t("mostUsed")}</div>`+top.map((d,i)=>opt(d,i)).join("");
  if(rest.length)h+=`<div class="grp">${t("library")}</div>`+rest.map((d,i)=>opt(d,i+top.length)).join("");
  if(!dxOpts.length&&q)h+=`<div class="grp">${t("noDxMatch")}</div>`;
  h+=`<div class="dxadd ${dxOpts.length===0&&q?"hl":""}" data-dxnew="1">${I.plus}${t("newDx")}${q?` «${esc(q)}»`:""}</div>`;
  $("dxMenu").innerHTML=h;$("dxMenu").hidden=false;
}
function hideDxMenu(){$("dxMenu").hidden=true;dxHL=-1}
function pickDx(d){curDx.push({id:d.id,code:d.code||""});$("v_dxq").value="";renderDxChips();hideDxMenu();$("v_dxq").focus()}
function commitDxTyping(){
  const q=$("v_dxq").value.trim();
  if(q){const ex=allDx().find(d=>[d.name.ku,d.name.ar,d.name.en,d.code].some(n=>n&&normText(n)===normText(q)));if(ex){if(!curDx.some(x=>x.id===ex.id))curDx.push({id:ex.id,code:ex.code||""})}else curDx.push({label:q});$("v_dxq").value="";renderDxChips()}
  hideDxMenu();
  if(!curDx.length){toast(t("dxRequired"));$("v_dxq").focus();return false}
  return true;
}
$("v_dxq").addEventListener("focus",()=>{if(!curDx.length||$("v_dxq").value)showDxMenu()});
$("v_dxq").addEventListener("blur",()=>setTimeout(hideDxMenu,120));
$("v_dxq").addEventListener("input",()=>{if($("v_dxq").value||!curDx.length)showDxMenu();else hideDxMenu()});
$("v_dxq").addEventListener("keydown",e=>{
  const menuOpen=!$("dxMenu").hidden;
  if(e.key==="ArrowDown"&&menuOpen){e.preventDefault();dxHL=Math.min(dxOpts.length-1,dxHL+1);showHL()}
  else if(e.key==="ArrowUp"&&menuOpen){e.preventDefault();dxHL=Math.max(0,dxHL-1);showHL()}
  else if(e.key==="Enter"){e.preventDefault();const q=e.target.value.trim();
    if(menuOpen&&dxHL>=0&&dxOpts[dxHL])pickDx(dxOpts[dxHL]);else if(q){if(!dxOpts.length)openDx(null,q);else{curDx.push({label:q});e.target.value="";renderDxChips();hideDxMenu()}}}
  else if(e.key==="Escape"&&menuOpen){e.preventDefault();e.stopPropagation();hideDxMenu()}
  else if(e.key==="Backspace"&&!e.target.value&&curDx.length){curDx.pop();renderDxChips()}
  else if(e.key==="ArrowDown"&&!menuOpen){e.preventDefault();showDxMenu();dxHL=0;showHL()}
});
function showHL(){$("dxMenu").querySelectorAll("[data-dxi]").forEach(el=>el.classList.toggle("hl",+el.dataset.dxi===dxHL));$("dxMenu").querySelector(".hl")?.scrollIntoView({block:"nearest"})}
$("dxMenu").addEventListener("mousedown",e=>{e.preventDefault();const o=e.target.closest("[data-dxi]");if(o)return pickDx(dxOpts[+o.dataset.dxi]);if(e.target.closest("[data-dxnew]"))openDx(null,$("v_dxq").value.trim())});
$("dxPick").addEventListener("click",e=>{const r=e.target.closest("[data-rmdx]");if(r){curDx.splice(+r.dataset.rmdx,1);renderDxChips();return}$("v_dxq").focus()});
document.addEventListener("mousedown",e=>{if(!e.target.closest(".dxwrap"))hideDxMenu()});
$("dxInfo").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=curDx[+(b.dataset.addtests??b.dataset.applymeds??b.dataset.savetpl)];const dd=d&&d.id&&dxById(d.id);if(!dd)return;
  const rowsEmpty=(id)=>[...$(id).children].filter(r=>!r.querySelector("input").value.trim());
  if(b.dataset.addtests!==undefined){
    const have=new Set([...$("labRows").children].map(r=>normText(r.querySelector("input").value)));
    rowsEmpty("labRows").forEach(r=>r.remove());
    let n=0;for(const k of dd.tests){const L=LABS[k];if(!L||have.has(normText(L[0])))continue;labRow({test:L[0],unit:L[1],range:L[2]});n++}
    toast(t("testsAdded")+` (${n})`);
  }else if(b.dataset.applymeds!==undefined){
    rowsEmpty("medRows").forEach(r=>r.remove());
    for(const m of db.dxTemplates[dd.id]||[])medRow(m);toast(t("medsApplied"));
  }else if(b.dataset.savetpl!==undefined){
    const meds=[...$("medRows").children].map(r=>[...r.querySelectorAll("input")].map(i=>i.value.trim())).filter(a=>a[0]).map(([name,dose,freq,days])=>({name,dose,freq,days}));
    if(!meds.length){toast(t("med")+" ?");return}
    db.dxTemplates[dd.id]=meds;save();renderDxInfo();toast(t("templateSaved"));
  }
});

let editingDx=null,dxFromVisit=false;
function openDx(d,prefill){
  editingDx=d?d.id:null;dxFromVisit=!!$("dlgVisit").open;
  $("dlgDxTitle").textContent=t(d?"editDx":"newDx");
  $("x_ku").value=d?.name.ku||"";$("x_ar").value=d?.name.ar||"";$("x_en").value=d?.name.en||"";
  if(!d&&prefill){if(/[\u0600-\u06FF]/.test(prefill))$(lang==="ar"?"x_ar":"x_ku").value=prefill;else if(/^[A-Z]\d/i.test(prefill))$("x_code").value=prefill.toUpperCase();else $("x_en").value=prefill}
  if(!(prefill&&/^[A-Z]\d/i.test(prefill)))$("x_code").value=d?.code||"";
  $("x_cat").innerHTML=`<option value="mine">${t("catMine")}</option>`+Object.keys(DXCATS).map(c=>`<option value="${c}">${esc(dxCatName(c))}</option>`).join("");
  $("x_cat").value=d?.cat||"mine";$("x_note").value=d?.note||"";
  const sel=new Set(d?.tests||[]);
  $("x_tests").innerHTML=Object.entries(LABS).map(([k,L])=>`<label dir="ltr"><input type="checkbox" value="${k}" ${sel.has(k)?"checked":""}>${esc(L[0])}</label>`).join("");
  hideDxMenu();openDlg($("dlgDx"));setTimeout(()=>$(lang==="en"?"x_en":lang==="ar"?"x_ar":"x_ku").focus(),30);
}
$("dlgDx").addEventListener("close",()=>{
  if($("dlgDx").returnValue!=="ok")return;
  const name={ku:$("x_ku").value.trim(),ar:$("x_ar").value.trim(),en:$("x_en").value.trim()};
  if(!name.ku&&!name.ar&&!name.en){toast(t("nameRequired"));setTimeout(()=>openDlg($("dlgDx")),0);return}
  const data={name,code:$("x_code").value.trim().toUpperCase(),cat:$("x_cat").value,note:$("x_note").value.trim(),tests:[...$("x_tests").querySelectorAll("input:checked")].map(i=>i.value)};
  let id=editingDx;
  if(id){Object.assign(db.customDx.find(x=>x.id===id),data)}else{id="c:"+uid();db.customDx.push({id,builtin:false,...data})}
  save();toast(t("dxSaved"));
  if(dxFromVisit&&!editingDx){curDx.push({id,code:data.code});$("v_dxq").value="";renderDxChips()}
  if(!$("dlgVisit").open)render();
});

function renderLibrary(){
  const q=state.dxq.trim(),usage=dxUsage();
  let list=q?searchDx(q).rest:allDx().slice().sort((a,b)=>(usage[b.id]||0)-(usage[a.id]||0)||(a.builtin===b.builtin?0:a.builtin?1:-1));
  if(state.dxcat!=="all")list=list.filter(d=>d.cat===state.dxcat);
  const cats=["all","mine",...Object.keys(DXCATS)].filter(c=>c==="all"||allDx().some(d=>d.cat===c));
  $("main").innerHTML=`<div class="wrap">
    <div class="libhead"><h1>${t("diagnoses")} <span class="num" style="font-size:14px;color:var(--muted);font-weight:500">${allDx().length} ${t("libCount")}</span></h1>
      <div class="libsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="libq" type="search" value="${esc(state.dxq)}" placeholder="${t("dxSearch")}" autocomplete="off"></div>
      <button class="btn gold" id="libNew">${I.plus}${t("newDx")}</button></div>
    <div class="cats">${cats.map(c=>`<button data-cat="${c}" class="${state.dxcat===c?"on":""}">${c==="all"?t("all"):esc(dxCatName(c))}</button>`).join("")}</div>
    <div class="libgrid">${list.map(d=>{const alt=["ku","ar","en"].filter(L=>L!==lang&&d.name[L]).map(L=>d.name[L]).join(" · ");
      return`<div class="lcard"><div class="t"><b>${esc(dxNameOf(d))}</b>${d.code?`<code dir="ltr">${esc(d.code)}</code>`:""}</div>
      ${alt?`<div class="alt">${esc(alt)}</div>`:""}${d.note?`<p dir="auto">${esc(d.note)}</p>`:""}
      ${d.tests.length?`<div class="tests" style="display:flex;flex-wrap:wrap;gap:5px">${d.tests.map(k=>`<span class="tchip" dir="ltr">${esc(LABS[k]?LABS[k][0]:k)}</span>`).join("")}</div>`:""}
      <div class="foot2"><span>${esc(dxCatName(d.cat))}${usage[d.id]?` · ${t("usedTimes")}: <b class="num">${usage[d.id]}</b>`:""}${(db.dxTemplates[d.id]||[]).length?` · ${I.pill.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px"')}`:""}</span>
        ${d.builtin?"":`<span style="display:flex;gap:6px;align-items:center"><span class="badge-mine">${t("mine")}</span><button class="iconbtn" data-editdx="${d.id}" title="${t("edit")}">${I.edit}</button><button class="iconbtn del" data-deldx="${d.id}" title="${t("del")}">${I.del}</button></span>`}</div></div>`}).join("")||`<div class="card empty">${t("noDxMatch")}</div>`}</div></div>`;
  const qi=$("libq");qi.oninput=()=>{state.dxq=qi.value;const pos=qi.selectionStart;renderLibrary();const n=$("libq");n.focus();n.setSelectionRange(pos,pos)};
}
$("main").addEventListener("click",e=>{
  const b=e.target.closest("[data-cat],#libNew,[data-editdx],[data-deldx]");if(!b)return;
  if(b.dataset.cat){state.dxcat=b.dataset.cat;renderLibrary()}
  else if(b.id==="libNew")openDx(null,state.dxq.trim());
  else if(b.dataset.editdx)openDx(db.customDx.find(x=>x.id===b.dataset.editdx));
  else if(b.dataset.deldx)ask(t("confirmDelDx")).then(ok=>{if(ok){db.customDx=db.customDx.filter(x=>x.id!==b.dataset.deldx);delete db.dxTemplates[b.dataset.deldx];save();renderLibrary();toast(t("deleted"))}});
});

function nextFileNo(){let mx=1000;for(const p of db.patients){const m=String(p.fileNo).match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1])}return"ZPH-"+(mx+1)}

let editingP=null;
function openPatient(p){
  editingP=p?p.id:null;
  $("dlgPatientTitle").textContent=t(p?"editPatient":"addPatient");
  $("p_name").value=p?.name||"";$("p_file").value=p?.fileNo||(ROLE==="secretary"?"":nextFileNo());if(ROLE==="secretary"&&!p)call("nextFileNo").then(n=>{if(!$("p_file").value)$("p_file").value=n}).catch(()=>{});$("p_birth").value=p?.birth||"";
  $("p_gender").value=p?.gender||"M";$("p_blood").value=p?.blood||"";$("p_phone").value=p?.phone||(state.q&&normPhone(state.q).length>=7?state.q:"");
  if(!p&&state.q&&normPhone(state.q).length<7)$("p_name").value=state.q;
  $("p_address").value=p?.address||"";$("p_allergies").value=p?.allergies||"";$("p_chronic").value=p?.chronic||"";
  openDlg($("dlgPatient"));$("p_name").focus();
}
$("dlgPatient").addEventListener("close",()=>{
  if($("dlgPatient").returnValue!=="ok")return;
  const data={name:$("p_name").value.trim(),fileNo:$("p_file").value.trim(),birth:$("p_birth").value,gender:$("p_gender").value,blood:$("p_blood").value,
    phone:$("p_phone").value.trim(),address:$("p_address").value.trim(),allergies:$("p_allergies").value.trim(),chronic:$("p_chronic").value.trim()};
  if(!data.name)return;
  if(ROLE==="secretary"){secSavePatient(data);return}
  if(editingP)Object.assign(db.patients.find(x=>x.id===editingP),data);
  else{const id=uid();db.patients.push({id,created:Date.now(),...data});state.patient=id;
    state.q="";$("search").value="";}
  save();render();toast(t("savedP"));
  $("plist").querySelector(".pitem.on")?.scrollIntoView({block:"nearest"});
});

let editingV=null;
function medRow(m={}){const r=document.createElement("div");r.className="r";
  r.innerHTML=`<input placeholder="${t("med")}" value="${esc(m.name)}" dir="auto"><input placeholder="${t("dose")}" value="${esc(m.dose)}" dir="auto"><input placeholder="${t("freq")}" value="${esc(m.freq)}" dir="auto"><input placeholder="${t("days")}" value="${esc(m.days)}" inputmode="numeric"><button type="button" class="x" aria-label="${t("del")}">×</button>`;
  $("medRows").appendChild(r);return r}
function labRow(l={}){const r=document.createElement("div");r.className="r";
  r.innerHTML=`<input placeholder="${t("test")}" value="${esc(l.test)}" dir="auto"><input placeholder="${t("result")}" value="${esc(l.value)}" dir="ltr"><input placeholder="${t("unit")}" value="${esc(l.unit)}" dir="ltr"><input placeholder="70-100" value="${esc(l.range)}" dir="ltr"><button type="button" class="x" aria-label="${t("del")}">×</button>`;
  $("labRows").appendChild(r);return r}
function openVisit(v){
  const p=db.patients.find(x=>x.id===state.patient);if(!p)return;
  editingV=v?v.id:null;
  $("dlgVisitTitle").textContent=t(v?"editVisit":"addVisit")+" · "+p.name;

  $("medRows").innerHTML="";$("labRows").innerHTML="";

$("addMed").onclick=()=>medRow().querySelector("input").focus();
$("addLab").onclick=()=>labRow().querySelector("input").focus();
$("dlgVisit").addEventListener("click",e=>{if(e.target.classList.contains("x"))e.target.parentElement.remove()});
$("dlgVisit").addEventListener("close",()=>{
  if($("dlgVisit").returnValue!=="ok")return;
  const vals=r=>[...r.querySelectorAll("input")].map(i=>i.value.trim());
  const meds=[...$("medRows").children].map(vals).filter(a=>a[0]).map(([name,dose,freq,days])=>({name,dose,freq,days}));
  const labs=[...$("labRows").children].map(vals).filter(a=>a[0]).map(([test,value,unit,range])=>({test,value,unit,range}));
  const dx=curDx.map(x=>x.id?{id:x.id,code:x.code||""}:{label:x.label});

  save();render();toast(t("savedV"));

const VIT=["bp","pulse","temp","weight","spo2"];
const VUNIT={bp:"mmHg",pulse:"/min",temp:"°C",weight:"kg",spo2:"%"};
function vitalsHTML(v){v=v||{};return VIT.filter(k=>v[k]).map(k=>`<span class="vit"><small>${t(k)}</small><span dir="ltr">${esc(v[k])} ${VUNIT[k]}</span></span>`).join("")}
function vitalsText(v){v=v||{};return VIT.filter(k=>v[k]).map(k=>`${t(k)}: ${v[k]} ${VUNIT[k]}`).join(" · ")}
function dxPills(list,extra){return(list||[]).map(x=>`<span class="dxp">${esc(x.label||dxLabel(x))}${x.code?`<code dir="ltr">${esc(x.code)}</code>`:""}</span>`).join("")+(extra?`<span class="dxp new">${esc(extra)}</span>`:"")}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(880,a.currentTime);o.frequency.setValueAtTime(660,a.currentTime+.22);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.6);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.65);setTimeout(()=>a.close(),900)}catch(e){}}

function secBannerHTML(p){
  if(ROLE!=="doctor")return"";

  return`<div class="secbanner noprint"><div class="h"><h2>${t("fromSec")}${q.from?" · "+esc(q.from):""}</h2><span class="tm num" style="color:var(--muted);font-size:12px">${hm(q.ts)}</span><span class="st ${q.status}">${t("st_"+q.status)}</span>

function markIn(pid){if(ROLE!=="doctor")return;const q=todayQ().find(x=>x.patientId===pid&&x.status==="waiting");if(q){q.status="in";q.inTs=Date.now();save();updateBadge()}}
function queueDone(pid){if(ROLE!=="doctor")return;const q=activeQ(pid);if(q){q.status="done";q.doneTs=Date.now();save()}}
function startVisitFromQueue(q){
  openVisit(null);
  if(q.complaint)$("v_complaint").value=q.complaint;
  const vt=vitalsText(q.vitals);if(vt)$("v_notes").value=vt;
  const out=[];
  for(const x of q.dx||[]){if(x.id&&dxById(x.id))out.push({id:x.id,code:x.code||""});else if(x.label)out.push({label:x.label})}
  if(q.dxNew){const ex=allDx().find(d=>[d.name.ku,d.name.ar,d.name.en,d.code].some(n=>n&&normText(n)===normText(q.dxNew)));out.push(ex?{id:ex.id,code:ex.code||""}:{label:q.dxNew})}
  const seen=new Set();curDx=out.filter(x=>{const k=x.id||("l:"+normText(x.label));if(seen.has(k))return false;seen.add(k);return true});
  renderDxChips();
}
$("main").addEventListener("click",e=>{
  const b=e.target.closest("[data-qopen],[data-qdone],[data-qstart]");if(!b||ROLE!=="doctor")return;
  const q=(db.queue||[]).find(x=>x.id===(b.dataset.qopen||b.dataset.qdone||b.dataset.qstart));if(!q)return;
  if(b.dataset.qopen){openP(q.patientId)}
  else if(b.dataset.qdone){q.status="done";q.doneTs=Date.now();save();render()}
  else if(b.dataset.qstart){if(q.status==="waiting"){q.status="in";save()}startVisitFromQueue(q)}
});

const clean=(s,n=300)=>String(s??"").slice(0,n).trim();
const pSum=(p,L)=>{const lv=visitsOf(p.id)[0];return{id:p.id,name:p.name,fileNo:p.fileNo,phone:p.phone,lastDate:lv?lv.date:"",lastDx:lv?dxTextL(lv,L):"",created:p.created||0}};
const qOut=q=>{const p=db.patients.find(x=>x.id===q.patientId)||{};return{id:q.id,patientId:q.patientId,name:p.name||"",fileNo:p.fileNo||"",status:q.status,ts:q.ts,complaint:q.complaint,from:q.from}};
const RPC={
  hello:()=>({name:prof().name,specialty:prof().specialty}),
  search:({q,lang:L})=>db.patients.filter(p=>matches(p,clean(q,80))).sort((a,b)=>activity(b)-activity(a)).slice(0,60).map(p=>pSum(p,L)),
  patient:({id,lang:L})=>{const p=db.patients.find(x=>x.id===id);if(!p)throw new Error("notfound");
    const{name,fileNo,birth,gender,blood,phone,address,allergies,chronic}=p;
    return{patient:{id:p.id,name,fileNo,birth,gender,blood,phone,address,allergies,chronic},
      visits:visitsOf(p.id).map(v=>({date:v.date,complaint:v.complaint||"",dx:visitDxList(v).map(x=>({id:x.id||"",code:x.code||"",label:dxLabel(x,L)}))})),
      queued:(q=>q?qOut(q):null)(activeQ(p.id))}},
  nextFileNo:()=>nextFileNo(),
  savePatient:({id,data},from)=>{
    const d=data||{};const rec={name:clean(d.name,120),fileNo:clean(d.fileNo,40),birth:clean(d.birth,10),gender:d.gender==="F"?"F":"M",blood:clean(d.blood,4),phone:clean(d.phone,40),address:clean(d.address,200),allergies:clean(d.allergies,300),chronic:clean(d.chronic,300)};
    if(!rec.name)throw new Error("name");
    let p;
    if(id){p=db.patients.find(x=>x.id===id);if(!p)throw new Error("notfound");Object.assign(p,rec)}
    else{if(!rec.fileNo)rec.fileNo=nextFileNo();p={id:uid(),created:Date.now(),by:clean(from&&from.name,60),...rec};db.patients.push(p)}
    save();renderList();if(state.patient===p.id||!state.patient)renderMain();
    return pSum(p,lang)},
  send:({patientId,complaint,vitals,dx,dxNew},from)=>{
    const p=db.patients.find(x=>x.id===patientId);if(!p)throw new Error("notfound");
    const v={};for(const k of VIT)if(vitals&&vitals[k])v[k]=clean(vitals[k],20);
    const list=(Array.isArray(dx)?dx:[]).slice(0,12).map(x=>x&&x.id&&dxById(x.id)?{id:x.id,code:clean(x.code,12)}:{label:clean(x&&x.label,120)}).filter(x=>x.id||x.label);
    db.queue=db.queue||[];
    let q=activeQ(p.id);const fresh=!q;
    if(!q){q={id:uid(),patientId:p.id,date:todayISO(),ts:Date.now(),status:"waiting"};db.queue.push(q)}
    Object.assign(q,{complaint:clean(complaint,600),vitals:v,dx:list,dxNew:clean(dxNew,120),from:clean(from&&from.name,60)});
    save();
    if(fresh){beep();toast(t("newArrival")+": "+p.name);try{window.desktop.flash()}catch(e){}}
    updateBadge();
    if(state.patient===p.id||(!state.patient&&state.view!=="dx"))renderMain();
    return qOut(q)},
  queue:()=>todayQ().map(qOut),
  cancel:({id})=>{const q=(db.queue||[]).find(x=>x.id===id);if(q&&q.status==="waiting"){q.status="cancelled";save();updateBadge();if(!state.patient&&state.view!=="dx"||state.patient===q.patientId)renderMain()}return true},
  dxNames:({lang:L})=>[...new Set(allDx().map(d=>dxNameOf(d,L)).filter(Boolean))]
};

  const r=await window.desktop.call(m,{...(p||{}),lang});

}

  const n=k=>(SEC.queue||[]).filter(q=>q.status===k).length;
  $("main").innerHTML=`<div class="wrap">${offBar()}
    <div class="dash-hero"><svg class="bigz" viewBox="0 0 300 300" aria-hidden="true"><path d="M20 18H222L142 96H20z M182 204H282V282H104z" fill="#fff" opacity=".55"/><path d="M222 18L282 72L116 282L56 230z" fill="#fff"/></svg><div class="date">${esc(todayISO())}</div><h1>${t("welcome")}${SEC.cfg&&SEC.cfg.secName?" · "+esc(SEC.cfg.secName):""}</h1><p>${t("secHomeSub")}</p><p style="margin-top:10px;color:#fff;font-weight:700">${esc(d.name||"")}${d.specialty?` <span style="color:var(--gold);font-weight:600">· ${esc(d.specialty)}</span>`:""}</p></div>
    <div class="kpis"><div class="kpi accent"><small>${t("waiting")}</small><b>${n("waiting")}</b></div><div class="kpi"><small>${t("st_in")}</small><b>${n("in")}</b></div><div class="kpi"><small>${t("st_done")}</small><b>${n("done")}</b></div><div class="kpi"><small>${t("queueToday")}</small><b>${(SEC.queue||[]).length}</b></div></div>
    <div class="sec-title"><h2>${t("queueToday")}</h2></div>${secQueueHTML()}</div>`;
}
async function loadSecPatient(id){
  SEC.loadingId=id;
  try{const r=await call("patient",{id});if(state.patient===id){SEC.cur=r;SEC.curId=id;secPatient()}}
  catch(e){if(state.patient===id){SEC.curId=id;SEC.cur=null;secPatient()}}
  finally{SEC.loadingId=null}
}
async function loadDxNames(){if(SEC.dxNames&&SEC.dxNames.lang===lang)return;try{const l=await call("dxNames");SEC.dxNames={lang,list:l};const dl=$("dxList");if(dl)dl.innerHTML=l.map(n=>`<option value="${esc(n)}">`).join("")}catch(e){}}
function secPatient(){
  const id=state.patient;
  if(SEC.curId!==id){$("main").innerHTML=`<div class="wrap"><div class="loadingbox"><span class="spin"></span>${t("loading")}</div></div>`;if(SEC.loadingId!==id)loadSecPatient(id);return}
  if(!SEC.cur){$("main").innerHTML=`<div class="wrap"><button class="backbtn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>${t("back")}</button>${offBar()||`<div class="card empty">${t("noPatients")}</div>`}</div>`;return}
  const{patient:p,visits,queued}=SEC.cur;
  const fact=(k,v)=>`<div><small>${t(k)}</small><span>${v||"—"}</span></div>`;
  const seen=new Set(),prev=[];
  for(const v of visits)for(const x of v.dx){const k=x.id||("l:"+normText(x.label));if(!seen.has(k)){seen.add(k);prev.push(x)}}
  $("main").innerHTML=`<div class="wrap">${offBar()}
  <button class="backbtn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>${t("back")}</button>
  <div class="phead"><div class="top"><div class="bigav" style="background:${hue(p.name)}">${esc(initials(p.name))}</div>
    <div><h1>${esc(p.name)}</h1><div class="sub"><span class="chip" dir="ltr">${esc(p.fileNo)||"—"}</span>${p.phone?`<span dir="ltr">${esc(p.phone)}</span>`:""}</div></div>
    <div class="acts"><button class="btn line sm" id="secEdit">${I.edit}${t("edit")}</button></div></div>
    <div class="facts">${fact("age",age(p.birth))}${fact("gender",p.gender==="F"?t("female"):t("male"))}${fact("blood",esc(p.blood))}${fact("address",esc(p.address))}</div>
    ${p.allergies||p.chronic?`<div class="alerts">${p.allergies?`<div class="alert red">${I.warn}<div><b>${t("allergyAlert")}</b>${esc(p.allergies)}</div></div>`:""}${p.chronic?`<div class="alert gold">${I.heart}<div><b>${t("chronicAlert")}</b>${esc(p.chronic)}</div></div>`:""}</div>`:""}
  </div>
  <div class="card sendcard">
    <div class="sh"><h2>${t("sendToDoctor")}</h2><span class="hint">${t("sendHint")}</span></div>
    ${queued?`<div class="inq"><span class="st ${queued.status}">${t("st_"+queued.status)}</span><span>${t("inQueue")} <span class="num">${hm(queued.ts)}</span></span>${queued.status==="waiting"?`<button class="btn danger sm" data-qcancel="${queued.id}">${t("cancelSend")}</button>`:""}</div>`:""}
    <label class="f"><span>${t("reason")}</span><textarea id="s_reason" rows="2" dir="auto"></textarea></label>
    <div class="g5">${VIT.map(k=>`<label class="f"><span>${t(k)} <small style="font-weight:500">${VUNIT[k]}</small></span><input id="s_${k}" dir="ltr" autocomplete="off" placeholder="${{bp:"120/80",pulse:"72",temp:"37",weight:"70",spo2:"98"}[k]}"></label>`).join("")}</div>
    ${prev.length?`<div style="display:grid;gap:7px"><span style="font-size:12.5px;font-weight:600;color:var(--muted)">${t("prevDx")} · <span style="font-weight:500">${t("prevDxHint")}</span></span>
      <div class="prevdx" id="s_prev">${prev.map((x,i)=>`<label><input type="checkbox" data-i="${i}" checked>${esc(x.label)}${x.code?` <code dir="ltr" style="font:500 10.5px var(--f-num);opacity:.7">${esc(x.code)}</code>`:""}</label>`).join("")}</div></div>`:""}
    <label class="f"><span>${t("newDxSec")}</span><input id="s_dx" list="dxList" autocomplete="off" dir="auto"></label><datalist id="dxList">${SEC.dxNames&&SEC.dxNames.lang===lang?SEC.dxNames.list.map(n=>`<option value="${esc(n)}">`).join(""):""}</datalist>
    <div style="display:flex;gap:10px;align-items:center"><button class="btn gold" id="s_send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-7z"/></svg>${t(queued?"resend":"sendToDoctor")}</button></div>
  </div>
  <div class="sec-title" style="margin-top:26px"><h2>${t("visitHistory")} <span class="num" style="color:var(--muted);font-weight:500;font-size:13px">${visits.length}</span></h2></div>
  ${visits.length?`<div class="hist">${visits.map(v=>`<div class="hrow"><span class="d" dir="ltr">${v.date}</span><div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${dxPills(v.dx)}</div>${v.complaint?`<div class="c" dir="auto">${esc(v.complaint)}</div>`:""}</div></div>`).join("")}</div>`:`<div class="card empty">${t("noPrev")}</div>`}
  </div>`;
  SEC.prev=prev;
  if(queued&&queued.status!=="done"){/* keep what was sent visible */}
  loadDxNames();
}
async function secRefreshQueue(){
  try{const q=await call("queue");const ch=JSON.stringify(q)!==JSON.stringify(SEC.queue);SEC.queue=q;updateBadge();if(ch&&!state.patient&&!document.querySelector("dialog[open]"))secMain()}catch(e){}
}
function secStart(){
  SEC.lastQ=null;SEC.results=[];render();secRefreshQueue();
  clearInterval(SEC.poll);SEC.poll=setInterval(()=>{if(ROLE==="secretary"&&SEC.cfg&&SEC.cfg.paired)secRefreshQueue()},4000);
}
$("main").addEventListener("click",async e=>{
  if(ROLE!=="secretary")return;
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="secRetry"){SEC.online=true;SEC.curId=null;SEC.lastQ=null;render();secRefreshQueue();return}
  if(b.id==="secEdit"&&SEC.cur){openPatient(SEC.cur.patient);return}
  if(b.dataset.qcancel){e.stopPropagation();try{await call("cancel",{id:b.dataset.qcancel});await secRefreshQueue();if(state.patient){SEC.curId=null;secPatient()}}catch(err){toast(t("offline"))}return}
  if(b.id==="s_send"){
    const vit={};for(const k of VIT){const v=$("s_"+k).value.trim();if(v)vit[k]=v}
    const dx=[...document.querySelectorAll("#s_prev input:checked")].map(i=>SEC.prev[+i.dataset.i]).map(x=>x.id?{id:x.id,code:x.code}:{label:x.label});
    const payload={patientId:state.patient,complaint:$("s_reason").value.trim(),vitals:vit,dx,dxNew:$("s_dx").value.trim()};
    b.disabled=true;
    try{await call("send",payload);toast(t("sent"));await secRefreshQueue();state.patient=null;SEC.curId=null;render()}
    catch(err){toast(t("offline"));b.disabled=false}
  }
});
$("profileCard").addEventListener("click",e=>{if(e.target.closest("#secChange"))openConnect(false)});

/* ---------------- secretary: connect dialog ---------------- */
let connDocs=[],connSel=null,connFirst=false;
function drawDocs(state_){
  const box=$("c_docs");
  if(state_==="scan"){box.innerHTML=`<div class="scanning"><span class="spin"></span>${t("searching")}</div>`;return}
  if(!connDocs.length){box.innerHTML=`<div class="hint" style="padding:8px 2px">${t("noneFound")}</div>`;return}
  box.innerHTML=connDocs.map((d,i)=>`<button type="button" class="docopt ${connSel===i?"on":""}" data-doc="${i}"><span class="av" style="background:${hue(d.name||d.host)}">${esc(initials(d.name||"?"))}</span><span><b dir="auto">${esc(d.name||"—")}</b><small dir="auto">${esc(d.specialty||"")}</small></span><code>${esc(d.host)}</code></button>`).join("");
}
async function doScan(extra){
  drawDocs("scan");$("c_scan").disabled=$("c_ipgo").disabled=true;
  try{const list=await window.desktop.scan(extra||"");
    if(extra){for(const d of list)if(!connDocs.some(x=>x.id===d.id))connDocs.push(d)}else connDocs=list;
    const prevId=SEC.cfg&&SEC.cfg.doctor&&SEC.cfg.doctor.id;
    const j=connDocs.findIndex(d=>extra?d.host===extra.split(":")[0]:d.id===prevId);
    connSel=j>=0?j:connDocs.length===1?0:connSel;
  }catch(e){}
  $("c_scan").disabled=$("c_ipgo").disabled=false;drawDocs();
}
function openConnect(first){
  connFirst=!!first;connSel=null;connDocs=[];
  $("c_name").value=(SEC.cfg&&SEC.cfg.secName)||"";$("c_code").value="";$("c_err").textContent="";$("c_ip").value="";
  $("c_x").hidden=$("c_cancel").hidden=!(SEC.cfg&&SEC.cfg.paired);
  $("c_role").hidden=!(connFirst&&!(SEC.cfg&&SEC.cfg.paired));
  openDlg($("dlgConnect"));setTimeout(()=>($("c_name").value?$("c_code"):$("c_name")).focus(),30);
  doScan();
}
$("dlgConnect").addEventListener("cancel",e=>{if(!(SEC.cfg&&SEC.cfg.paired))e.preventDefault()});
$("c_docs").addEventListener("click",e=>{const b=e.target.closest("[data-doc]");if(!b)return;connSel=+b.dataset.doc;drawDocs();$("c_code").focus()});
$("c_scan").onclick=()=>doScan();
$("c_ipgo").onclick=()=>{const v=$("c_ip").value.trim();if(v)doScan(v)};
$("c_ip").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();$("c_ipgo").click()}},true);
$("c_code").addEventListener("input",e=>{e.target.value=latinDigits(e.target.value).replace(/\D/g,"").slice(0,6)});
$("c_code").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();$("c_go").click()}},true);
$("c_role").onclick=async()=>{if(!(await ask(t("roleDoctor")+"?")))return openDlg($("dlgConnect"));await window.desktop.setRole("doctor");location.reload()};
$("c_go").onclick=async()=>{
  const name=$("c_name").value.trim(),code=$("c_code").value.trim(),err=$("c_err");err.textContent="";
  if(!name){$("c_name").focus();err.textContent=t("secName")+" *";return}
  if(connSel===null||!connDocs[connSel]){err.textContent=t("pickDoctor");return}
  if(code.length!==6){$("c_code").focus();err.textContent=t("pairCode")+" *";return}
  const d=connDocs[connSel];$("c_go").disabled=true;
  const r=await window.desktop.pair({host:d.host,port:d.port,code,name});
  $("c_go").disabled=false;
  if(r&&r.ok){SEC.cfg=await window.desktop.cfg();SEC.online=true;SEC.curId=null;state.patient=null;closeDlg($("dlgConnect"),"ok");toast(t("connected")+" · "+(SEC.cfg.doctor.name||""));secStart()}
  else err.textContent=t(r&&r.error==="code"?"badCode":r&&r.error==="wait"?"waitCode":"offline");
};

/* ---------------- updates ---------------- */
function showUpd(v){if(!v)return;$("updMsg").textContent=t("updReady").replace("{v}",v);$("updNow").textContent=t("updNow");$("updLater").textContent=t("updLater");$("updatebar").hidden=false}
$("updNow").onclick=()=>{try{window.desktop.installUpdate()}catch(e){}};
$("updLater").onclick=()=>{$("updatebar").hidden=true};

/* ---------------- start-up ---------------- */
function chooseRole(){return new Promise(res=>{const d=$("dlgRole");d.addEventListener("cancel",e=>e.preventDefault());d.onclick=e=>{const b=e.target.closest("[data-role]");if(!b)return;closeDlg(d,"ok");res(b.dataset.role)};openDlg(d)})}
async function bootDesktop(){
  const D=window.desktop;
  $("openBackups").hidden=false;$("openBackups").onclick=()=>D.openBackups();
  try{D.version().then(v=>{$("verLbl").textContent="v"+v})}catch(e){}
  try{D.onUpdate(showUpd);D.updateStatus().then(showUpd)}catch(e){}
  let c=await D.cfg();
  let role=c.role;
  const had=!db.sample&&(db.patients.length>0||!!db.profile);
  if(!role){
    if(had)role="doctor";
    else{ROLE=null;role=await chooseRole()}
    await D.setRole(role);c=await D.cfg();
  }
  ROLE=role;try{localStorage.setItem("zph_role",role)}catch(e){}
  document.body.classList.toggle("sec",role==="secretary");
  if(role==="secretary"){
    SEC.cfg=c;render();
    if(!c.paired)openConnect(true);else secStart();
    return;
  }
  // doctor
  $("lanBtn").hidden=false;
  $("lanBtn").onclick=async()=>{await renderLan();openDlg($("dlgLan"))};
  D.onLanChanged(()=>{if($("dlgLan").open)renderLan()});
  D.onRequest((m,p,from)=>{if(ROLE!=="doctor")throw new Error("role");const f=RPC[m];if(!f)throw new Error("unknown");return f(p,from)});
  render();
  if(!had){const j=await D.latestBackup();if(j){try{const d=JSON.parse(j);if(Array.isArray(d.patients)&&(d.patients.length||d.profile)){db=migrate(d);save();render();toast(t("imported"))}}catch(e){}}}
  syncProfile();
  if(!db.profile)openDoctor(true);
}
async function secSavePatient(data){
  try{const r=await call("savePatient",{id:editingP,data});state.patient=r.id;SEC.curId=null;if(!editingP){state.q="";$("search").value=""}SEC.lastQ=null;render();toast(t("savedP"))}
  catch(e){toast(e.message==="name"?t("name")+" *":t("offline"))}
}

applyLang();
if(window.desktop){bootDesktop()}else{
let framed=false;try{framed=window.self!==window.top}catch(e){framed=true}
if(framed||location.protocol!=="file:"&&!/^https?:$/.test(location.protocol)){
  const o=document.createElement("div");
  o.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(4,25,24,.92);color:#fff;display:grid;place-items:center;padding:24px;text-align:center;font:600 15px/1.7 var(--f-body)";
  o.innerHTML=`<div style="max-width:520px;display:grid;gap:14px;justify-items:center"><img src="${LOGO}" style="width:64px;height:64px;border-radius:14px;background:#fff;padding:6px" alt="">
  <div style="font-size:20px;font-weight:800">Preview only · تەنێ پێشچاڤ · معاينة فقط</div>
  <div dir="rtl">ئەڤە تەنێ پێشچاڤە. فایلی داگرە و ل سەر کۆمپیوتەری دوو جاران کلیک لێ بکە.</div>
  <div dir="rtl">هذه معاينة فقط. نزّل الملف وافتحه بالنقر المزدوج على الحاسوب.</div>
  <div>This is only a preview. Download the file and double-click it on your computer.</div>
  <div>Bu sadece önizleme. Dosyayı indirip bilgisayarda çift tıklayarak açın.</div>
  <button class="btn line" id="ovClose" style="margin-top:6px">OK</button></div>`;
  document.body.appendChild(o);o.querySelector("#ovClose").onclick=()=>o.remove();
}else if(!db.profile)openDoctor(true);
}
</script>
</body>
</html>
