name: Build and publish Zakho Private Records
on:
  push:
    branches: [records-app]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version
        id: v
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "records-v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
          gh release delete ci-ping --cleanup-tag -y || true
      - name: Install
        if: steps.v.outputs.exists == '0'
        run: npm ci
      - name: Build Windows installer
        if: steps.v.outputs.exists == '0'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish release
        if: steps.v.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: records-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Zakho Private Records ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
